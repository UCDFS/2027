<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Sprint event telemetry dashboard. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Slab:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard-common.css" />
    <style>
      /* Shared 800x480 dashboard canvas and dark scrim. */
      .dashboard-screen {
        position: relative; width: 800px; height: 480px; overflow: hidden;
        background: linear-gradient(rgba(7, 13, 26, 0.78), rgba(7, 13, 26, 0.82)), url("dashBg.jpg") lightgray 50% / cover no-repeat;
        border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: inset 0 0 0 1px rgba(11, 18, 32, 0.30);
        color: #141925; font-family: "Josefin Slab", Georgia, serif;
      }

      /* Sprint label and selected driver share the narrow top status bar. */
      .dashboard-header {
        position: absolute; z-index: 3; top: 0; right: 0; left: 0; display: flex; height: 44px;
        align-items: stretch; border-bottom: 1px solid rgba(97, 190, 255, 0.24);
        background: rgba(8, 15, 29, 0.62); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      }

      .event-label,
      .driver-name {
        display: flex; min-width: 112px; align-items: center; padding: 0 16px; color: #91a5bd; font-size: 10px;
        font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase;
      }

      .event-label {
        border-right: 1px solid rgba(97, 190, 255, 0.13); color: #dff7ff;
        background: linear-gradient(180deg, rgba(14, 165, 233, 0.18), rgba(14, 165, 233, 0.04));
        box-shadow: inset 0 -2px #38bdf8, 0 2px 14px rgba(56, 189, 248, 0.12);
      }

      .driver-name {
        min-width: 180px; padding-left: 22px; border-right: 1px solid rgba(97, 190, 255, 0.13); color: #8d9ab0;
      }

      /* Large translucent FS mark behind the sprint metrics. */
      .fs-logo {
        position: absolute; top: 50%; left: 50%; width: 658px; height: 504px; transform: translate(-50%, -50%);
        background: url("fslogo-transparent.png") transparent -59.127px -311.797px / 115.052% 161.864% no-repeat;
        opacity: 0.45; mix-blend-mode: screen; filter: blur(1px);
      }

      /* Circle surface shared by each sprint reading. */
      .metric {
        position: absolute; z-index: 1; display: flex; flex-direction: column; align-items: center;
        justify-content: center; border-radius: 50%; text-align: center;
      }

      .metric::before {
        position: absolute; z-index: -1; border: 1px solid rgba(219, 242, 255, 0.82); border-radius: 50%;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(222, 235, 248, 0.88));
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.18), inset 0 0 18px rgba(255, 255, 255, 0.62); content: "";
        filter: blur(3px); inset: 4px;
      }

      .metric-speed::before,
      .metric-motor-temp::before,
      .metric-cell-peak::before,
      .metric-inverter-temp::before {
        inset: 0; border: 0; background: #fff; box-shadow: none; filter: blur(4px);
      }

      .metric-speed::before,
      .metric-cell-peak::before,
      .metric-inverter-temp::before {
        background: rgba(255, 255, 255, 0.902);
      }

      .metric-label {
        color: #63748b; font-size: 16px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
        text-shadow: 0 1px rgba(255, 255, 255, 0.65);
      }

      .metric-value {
        margin-top: 4px; color: #111827; font-size: 40px; font-weight: 700; line-height: 1; white-space: nowrap;
      }

      .metric-lap-time .metric-value,
      .metric-temperature .metric-label,
      .metric-temperature .metric-value {
        --alert-color: #111827;
      }

      .metric-lap-time .metric-value.delta-ahead {
        --alert-color: #7e22ce; animation: metric-alert-flash 900ms ease-in-out infinite;
      }

      .metric-lap-time .metric-value.delta-on-target {
        --alert-color: #15803d; animation: metric-alert-flash 900ms ease-in-out infinite;
      }

      .metric-lap-time .metric-value.delta-behind {
        --alert-color: #a16207; animation: metric-alert-flash 900ms ease-in-out infinite;
      }

      .metric-temperature.is-over-limit .metric-label,
      .metric-temperature.is-over-limit .metric-value {
        --alert-color: #7f1d1d; animation: metric-alert-flash 900ms ease-in-out infinite;
      }

      @keyframes metric-alert-flash {
        0%,
        100% {
          color: #111827;
        }

        50% {
          color: var(--alert-color);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .metric-lap-time .metric-value.delta-ahead,
        .metric-lap-time .metric-value.delta-on-target,
        .metric-lap-time .metric-value.delta-behind,
        .metric-temperature.is-over-limit .metric-label,
        .metric-temperature.is-over-limit .metric-value {
          animation: none; color: var(--alert-color);
        }
      }

      .metric-unit {
        font-size: 0.68em;
      }

      /* Dominant sprint speed readout in the middle of the display. */
      .metric-speed {
        top: 92px; left: 250px; width: 300px; height: 300px;
      }

      .metric-speed .metric-label {
        font-size: 30px;
      }

      .metric-speed .metric-value {
        width: 347px; margin-top: 8px; font-size: 150px; line-height: normal;
      }

      .metric-speed .metric-unit {
        margin-top: 0; font-size: 48px;
      }

      /* Sprint lap time sits at the upper-left. */
      .metric-lap-time {
        top: 48px; left: 20px; width: 220px; height: 220px;
      }

      .metric-lap-time .metric-label {
        font-size: 26px;
      }

      .metric-lap-time .metric-value {
        font-size: 42px;
      }

      /* Pack voltage dial occupies the lower-left, with colored segment ticks. */
      .metric-pack-voltage {
        bottom: 12px; left: 64px; width: 184px; height: 184px;
      }

      .voltage-ticks {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible;
      }

      .voltage-tick {
        fill: #576375; opacity: 0.92; --tick-glow: rgba(125, 211, 252, 0.45);
        filter: drop-shadow(0 0 2px var(--tick-glow));
        transition: fill 350ms ease, filter 350ms ease, opacity 350ms ease;
        animation: voltage-tick-ignite 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .voltage-tick.zone-green {
        fill: #70f05b; --tick-glow: rgba(112, 240, 91, 0.7);
      }

      .voltage-tick.zone-yellow {
        fill: #ffd447; --tick-glow: rgba(255, 212, 71, 0.7);
      }

      .voltage-tick.zone-orange {
        fill: #ff8a36; --tick-glow: rgba(255, 138, 54, 0.72);
      }

      .voltage-tick.zone-red {
        fill: #e84c43; --tick-glow: rgba(232, 76, 67, 0.72);
      }

      @keyframes voltage-tick-ignite {
        from {
          opacity: 0.2; filter: blur(3px) drop-shadow(0 0 5px var(--tick-glow));
        }

        to {
          opacity: 0.96; filter: blur(0) drop-shadow(0 0 2px var(--tick-glow));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .voltage-tick {
          animation: none; transition: none; filter: none;
        }
      }

      .metric-pack-voltage .metric-label {
        max-width: 130px; font-size: 18px; line-height: 0.95;
      }

      .metric-pack-voltage .metric-value {
        margin-top: 12px; font-size: 42px;
      }

      /* Motor temperature at the upper-right, layered over the header edge. */
      .metric-motor-temp {
        z-index: 4; top: 8px; left: 64%; width: 140px; height: 140px;
      }

      /* Cell peak temperature on the right, enlarged typography retained. */
      .metric-cell-peak {
        top: 126px; right: 6px; width: 200px; height: 200px;
      }

      .metric-cell-peak .metric-label {
        font-size: 17px;
      }

      .metric-cell-peak .metric-value {
        display: flex; width: 100%; height: 123px; flex-direction: row; align-items: center;
        justify-content: center; margin-top: 0; color: #000; font-size: 72px; font-weight: 600;
        line-height: normal; letter-spacing: 0.8px; text-transform: uppercase;
      }

      .metric-cell-peak .metric-unit {
        color: #000; font-size: 64px; font-weight: 600; line-height: normal; letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      /* Inverter temperature sits below and left of Cell Peak. */
      .metric-inverter-temp {
        left: 64%; bottom: 8px; width: 150px; height: 150px;
      }

      /* Menu dropdown consistent with the other dashboard pages. */
      .dashboard-menu {
        position: absolute; z-index: 5; top: 8px; right: 16px; font-family: Arial, Helvetica, sans-serif;
      }

      .menu-toggle {
        display: flex; width: 96px; height: 36px; padding: 8px 12px; align-items: center;
        justify-content: center; gap: 10px; border: 0; border-radius: 10px;
        background: rgba(255, 255, 255, 0.902); color: #0b1220; font: 600 13px/1 "Josefin Slab", Georgia, serif;
        cursor: pointer;
      }

      .menu-toggle:hover {
        background: #fff;
      }

      .menu-toggle:focus-visible,
      .menu-item:focus-visible {
        outline: 2px solid #fff; outline-offset: -2px;
      }

      .menu-icon {
        width: 16px; height: 16px; flex: 0 0 16px;
      }

      .menu-panel {
        position: absolute; top: 44px; right: 0; width: 224px; padding: 6px;
        border: 1px solid rgba(103, 210, 255, 0.28); border-radius: 10px; background: rgba(8, 15, 29, 0.97);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), 0 0 18px rgba(56, 189, 248, 0.10);
      }

      .menu-panel[hidden] {
        display: none;
      }

      .menu-item {
        display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 6px; background: transparent;
        color: rgba(255, 255, 255, 0.9); text-align: left; text-decoration: none;
        font: 14px/1.3 Arial, Helvetica, sans-serif; cursor: pointer;
      }

      .menu-item:hover,
      .menu-item[aria-current="page"] {
        background: rgba(56, 189, 248, 0.14); color: #e2f6ff;
      }

      @media (max-width: 860px) {
        .dashboard-screen {
          width: min(90vw, 800px); height: min(60vw, 480px);
        }

        .dashboard-header {
          height: 9.17%;
        }

        .event-label,
        .driver-name {
          min-width: 14%; padding: 0 2%; font-size: clamp(6px, 1.25vw, 10px); letter-spacing: 0.6px;
        }

        .driver-name {
          min-width: 23%;
        }

        .fs-logo {
          width: 82.25%; height: 105%; background-position: -9% -62%; background-size: 115.052% 161.864%;
        }

        .metric-speed {
          top: 19.17%; left: 31.25%; width: 37.5%; height: auto; aspect-ratio: 1;
        }

        .metric-speed .metric-label {
          font-size: clamp(14px, 3.75vw, 30px);
        }

        .metric-speed .metric-value {
          width: 115.67%; font-size: clamp(54px, 18.75vw, 150px);
        }

        .metric-speed .metric-unit {
          font-size: clamp(24px, 6vw, 48px);
        }

        .metric-lap-time {
          top: 10%; left: 2.5%; width: 27.5%; height: 45.83%;
        }

        .metric-lap-time .metric-label {
          font-size: clamp(14px, 3.25vw, 26px);
        }

        .metric-lap-time .metric-value {
          font-size: clamp(22px, 5.25vw, 42px);
        }

        .metric-pack-voltage {
          bottom: 2.5%; left: 8%; width: 23%; height: 38.3%;
        }

        .metric-pack-voltage .metric-label {
          font-size: clamp(8px, 2.25vw, 18px);
        }

        .metric-pack-voltage .metric-value {
          margin-top: 5%; font-size: clamp(20px, 5.25vw, 42px);
        }

        .metric-motor-temp {
          top: 1.67%; left: 64%; width: 17.5%; height: auto; aspect-ratio: 1;
        }

        .metric-cell-peak {
          top: 26.25%; right: 0.75%; width: 25%; height: auto; aspect-ratio: 1;
        }

        .metric-cell-peak .metric-label {
          font-size: clamp(8px, 2.125vw, 17px);
        }

        .metric-cell-peak .metric-value {
          width: 98%; height: 57%; font-size: clamp(34px, 9vw, 72px);
        }

        .metric-cell-peak .metric-unit {
          font-size: clamp(30px, 8vw, 64px);
        }

        .metric-inverter-temp {
          left: 64%; bottom: 1.67%; width: 18.75%; right: auto; height: auto; aspect-ratio: 1;
        }

        .metric-label {
          font-size: clamp(8px, 2vw, 16px);
        }

        .metric-value {
          font-size: clamp(20px, 5vw, 40px);
        }

        .dashboard-menu {
          top: 1.67%; right: 1.5%;
        }

        .menu-toggle {
          width: 88px; height: 32px;
        }
      }
    </style>
  </head>
  <body>
    <main class="dashboard-screen" aria-label="Sprint dashboard">
      <header class="dashboard-header">
        <div class="event-label">Sprint</div>
        <div class="driver-name" id="driver-name">Driver Name</div>
      </header>

      <div class="fs-logo" role="img" aria-label="Formula Student logo"></div>

      <!-- Values are updated by the decoded CAN/RPi/VCU browser bridge below. -->
      <section class="metric metric-lap-time" aria-label="Sprint lap time">
        <span class="metric-label">Lap Time</span>
        <span class="metric-value" id="lap-time-value">00:00.00</span>
      </section>

      <section class="metric metric-pack-voltage" aria-label="Pack voltage">
        <svg class="voltage-ticks" viewBox="0 0 184 184" aria-hidden="true"></svg>
        <span class="metric-label">Pack<br />Voltage</span>
        <span class="metric-value"><span id="pack-voltage-value">000</span><span class="metric-unit">V</span></span>
      </section>

      <section class="metric metric-speed" aria-label="Vehicle speed">
        <span class="metric-label">Speed</span>
        <span class="metric-value" id="speed-value">000</span>
        <span class="metric-unit">kph</span>
      </section>

      <section class="metric metric-motor-temp metric-temperature" aria-label="Motor temperature">
        <span class="metric-label">Motor Temp</span>
        <span class="metric-value"><span id="motor-temp-value">00</span><span class="metric-unit"> °C</span></span>
      </section>

      <section class="metric metric-cell-peak metric-temperature" aria-label="Cell peak temperature">
        <span class="metric-label">Cell Peak</span>
        <span class="metric-value"><span id="cell-peak-value">00</span><span class="metric-unit">°C</span></span>
      </section>

      <section class="metric metric-inverter-temp metric-temperature" aria-label="Inverter temperature">
        <span class="metric-label">Inverter Temp</span>
        <span class="metric-value"><span id="inverter-temp-value">00</span><span class="metric-unit"> °C</span></span>
      </section>

      <div class="dashboard-menu">
        <button
          class="menu-toggle"
          id="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="menu-panel"
        >
          <svg class="menu-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <span>Menu</span>
        </button>
        <nav class="menu-panel" id="menu-panel" aria-label="Dashboard menu" hidden>
          <a class="menu-item" href="dash.html">Driver selection</a>
          <a class="menu-item" href="default-driver.html">Driver dashboard</a>
          <a class="menu-item" href="mech-telemetry.html">Mechanical telemetry</a>
          <a class="menu-item" href="personal-bests.html" id="personal-bests-link" hidden>Personal bests</a>
          <a class="menu-item" href="event-dashboard.html?event=acceleration">Acceleration</a>
          <a class="menu-item" href="event-dashboard.html?event=skid-pad">Skid Pad</a>
          <a class="menu-item" href="sprint-dashboard.html" aria-current="page">Sprint</a>
          <a class="menu-item" href="endurance-dashboard.html">Endurance</a>
        </nav>
      </div>
    </main>
    <script src="dashboard-common.js"></script>
    <script>
      const $ = DashboardCommon.query;
      DashboardCommon.showSelectedDriver("#driver-name", "the Sprint dashboard");

      const fields = {
        speedKph: ["#speed-value", 0, 3, 0],
        packVoltageV: ["#pack-voltage-value", 0, 3, 0],
        motorTempC: ["#motor-temp-value", 0, 2],
        cellPeakTempC: ["#cell-peak-value", 0, 2],
        inverterTempC: ["#inverter-temp-value", 0, 2],
      };
      const temperatureMetrics = {
        motorTempC: ".metric-motor-temp",
        cellPeakTempC: ".metric-cell-peak",
        inverterTempC: ".metric-inverter-temp",
      };
      const alertThresholds = { proposedLapTimeMs: null, motorTempC: null, cellPeakTempC: null, inverterTempC: null };
      const latest = {};
      const lapTime = $("#lap-time-value");

      function updateLapAlert() {
        const delta = latest.lapTimeMs - alertThresholds.proposedLapTimeMs;
        const state = alertThresholds.proposedLapTimeMs === null || latest.lapTimeMs === undefined
          ? ""
          : delta < -200 ? "delta-ahead" : delta <= 200 ? "delta-on-target" : "delta-behind";
        lapTime.classList.remove("delta-ahead", "delta-on-target", "delta-behind");
        if (state) lapTime.classList.add(state);
      }

      function updateTemperatureAlert(key) {
        $(temperatureMetrics[key]).classList.toggle("is-over-limit",
          latest[key] !== undefined && alertThresholds[key] !== null && latest[key] > alertThresholds[key]);
      }

      window.setSprintAlertThresholds = (updates) => {
        if (!updates || typeof updates !== "object" || Array.isArray(updates)) {
          throw new TypeError("Sprint alert thresholds must be an object.");
        }
        const entries = Object.entries(updates);
        if (!entries.length) throw new TypeError("At least one sprint alert threshold must be provided.");
        for (const [key, value] of entries) {
          if (!Object.hasOwn(alertThresholds, key)) {
            throw new RangeError(`Unknown sprint alert threshold: ${key}`);
          }
          if (value !== null && (typeof value !== "number" || !Number.isFinite(value) || value < 0)) {
            throw new RangeError(`Sprint alert threshold "${key}" must be null or a finite, non-negative number.`);
          }
        }
        for (const [key, value] of entries) {
          alertThresholds[key] = value;
          if (key === "proposedLapTimeMs") {
            updateLapAlert();
          } else updateTemperatureAlert(key);
        }
      };

      function formatLapTime(milliseconds) {
        const centiseconds = Math.floor(milliseconds / 10);
        return `${String(Math.floor(centiseconds / 6000)).padStart(2, "0")}:` +
          `${String(Math.floor(centiseconds / 100) % 60).padStart(2, "0")}.` +
          String(centiseconds % 100).padStart(2, "0");
      }

      window.updateSprintTelemetry = (readings) => {
        if (!readings || typeof readings !== "object" || Array.isArray(readings)) {
          throw new TypeError("Sprint telemetry readings must be an object.");
        }
        const updates = Object.entries(readings);
        if (!updates.length) throw new TypeError("At least one sprint telemetry reading must be provided.");
        for (const [key, value] of updates) {
          if (key === "lapTimeMs") {
            if (typeof value !== "number" || !Number.isFinite(value) || value < 0) {
              throw new RangeError("Lap time must be a finite, non-negative number of milliseconds.");
            }
          }
        }

        const telemetry = Object.fromEntries(updates.filter(([key]) => key !== "lapTimeMs"));
        const prepared = DashboardCommon.prepareTelemetry(telemetry, fields, "Sprint");
        DashboardCommon.applyTelemetry(prepared);

        for (const [key, value] of updates) {
          if (key === "lapTimeMs") {
            latest[key] = value;
            lapTime.textContent = formatLapTime(value);
            updateLapAlert();
            continue;
          }
          if (Object.hasOwn(temperatureMetrics, key)) {
            latest[key] = value;
            updateTemperatureAlert(key);
          }
        }
      };

      DashboardCommon.initVoltageTicks();

      window.addEventListener("can-telemetry", (event) => {
        window.updateSprintTelemetry(event.detail);
      });

      DashboardCommon.initMenu();
    </script>
  </body>
</html>
