<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endurance Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Slab:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard-common.css" />
    <style>
      .dashboard-screen {
        position: relative;
        width: 800px;
        height: 480px;
        overflow: hidden;
        background:
          linear-gradient(rgba(7, 13, 26, 0.78), rgba(7, 13, 26, 0.82)),
          url("dashBg.jpg") lightgray 50% / cover no-repeat;
        color: #141925;
        font-family: "Josefin Slab", Georgia, serif;
      }

      .fs-logo {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        width: 658px;
        height: 504px;
        transform: translate(-50%, -50%);
        background: url("fslogo-transparent.png") transparent -59.127px -311.797px / 115.052% 161.864% no-repeat;
        opacity: 0.35;
        mix-blend-mode: screen;
        filter: blur(1px);
      }

      .dashboard-header {
        position: absolute;
        z-index: 1;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        height: 44px;
        border-bottom: 1px solid rgba(97, 190, 255, 0.24);
        background: rgba(8, 15, 29, 0.62);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }

      .event-label,
      .driver-name {
        display: flex;
        min-width: 112px;
        align-items: center;
        padding: 0 16px;
        border-right: 1px solid rgba(97, 190, 255, 0.13);
        color: #91a5bd;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }

      .event-label {
        color: #dff7ff;
        background: linear-gradient(180deg, rgba(14, 165, 233, 0.18), rgba(14, 165, 233, 0.04));
        box-shadow: inset 0 -2px #38bdf8;
      }

      .driver-name {
        min-width: 180px;
        padding-left: 22px;
        color: #8d9ab0;
      }

      .dashboard-menu {
        position: absolute;
        z-index: 5;
        top: 8px;
        right: 16px;
        font-family: Arial, Helvetica, sans-serif;
      }

      .menu-toggle {
        display: flex;
        width: 96px;
        height: 36px;
        padding: 8px 12px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.902);
        color: #0b1220;
        font: 600 13px/1 "Josefin Slab", Georgia, serif;
        cursor: pointer;
      }

      .menu-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
      }

      .menu-panel {
        position: absolute;
        top: 44px;
        right: 0;
        width: 224px;
        padding: 6px;
        border: 1px solid rgba(103, 210, 255, 0.28);
        border-radius: 10px;
        background: rgba(8, 15, 29, 0.97);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }

      .menu-panel[hidden] {
        display: none;
      }

      .menu-item {
        display: block;
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        font: 14px/1.3 Arial, Helvetica, sans-serif;
      }

      .menu-item:hover,
      .menu-item[aria-current="page"] {
        background: rgba(56, 189, 248, 0.14);
        color: #e2f6ff;
      }

      .metric {
        position: absolute;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        text-align: center;
      }

      .metric::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        border-radius: inherit;
        background: rgba(255, 255, 255, 0.9);
        content: "";
        filter: blur(4px);
      }

      .metric-label {
        color: #778092;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      .metric-value {
        color: #111827;
        font-size: 40px;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
      }

      .metric-lap-time {
        top: 62px;
        left: 28px;
        width: 170px;
        height: 170px;
        gap: 7px;
      }

      .metric-lap-time .metric-label {
        font-size: 21px;
      }

      .metric-lap-time .metric-value {
        --alert-color: #a020f0;
        color: var(--alert-color);
        font-size: 32px;
      }

      .metric-lap-time .lap-delta {
        --alert-color: #58a64a;
        color: var(--alert-color);
        font-size: 22px;
      }

      .metric-lap-time .metric-value.delta-ahead,
      .metric-lap-time .lap-delta.delta-ahead {
        --alert-color: #7e22ce;
      }

      .metric-lap-time .metric-value.delta-on-target,
      .metric-lap-time .lap-delta.delta-on-target {
        --alert-color: #15803d;
      }

      .metric-lap-time .metric-value.delta-behind,
      .metric-lap-time .lap-delta.delta-behind {
        --alert-color: #a16207;
      }

      .metric-lap-time .lap-flash {
        animation: lap-result-flash 450ms ease-in-out 2;
      }

      @keyframes lap-result-flash {
        0%,
        100% {
          color: #111827;
        }

        50% {
          color: var(--alert-color);
        }
      }

      .metric-speed {
        top: 92px;
        left: 250px;
        width: 300px;
        height: 300px;
      }

      .metric-speed .metric-label {
        font-size: 30px;
      }

      .metric-speed .metric-value {
        font-size: 150px;
        line-height: 1.05;
      }

      .metric-speed .metric-unit {
        font-size: 48px;
        font-weight: 700;
      }

      .metric-power {
        top: 160px;
        right: 6px;
        width: 200px;
        height: 200px;
        gap: 5px;
      }

      .metric-power .metric-value {
        color: #000;
        font-size: 62px;
      }

      .metric-power .metric-unit {
        font-size: 32px;
      }

      .metric-power .metric-label {
        font-size: 22px;
      }

      .metric-motor-temp {
        top: 8px;
        left: 520px;
        width: 140px;
        height: 140px;
      }

      .metric-cell-peak {
        bottom: 8px;
        left: 515px;
        width: 140px;
        height: 140px;
      }

      .metric-temperature .metric-label {
        font-size: 15px;
      }

      .metric-temperature .metric-value {
        margin-top: 5px;
        font-size: 34px;
      }

      .metric-temperature.is-over-limit .metric-label,
      .metric-temperature.is-over-limit .metric-value {
        --alert-color: #7f1d1d;
        animation: metric-alert-flash 900ms ease-in-out infinite;
      }

      @keyframes metric-alert-flash {
        0%,
        100% {
          color: #111827;
        }

        50% {
          color: var(--alert-color);
        }
      }

      .pack-regen {
        position: absolute;
        z-index: 3;
        bottom: 12px;
        left: 44px;
        width: 215px;
        height: 215px;
        color: #151a27;
        text-align: center;
      }

      .pack-regen::before {
        position: absolute;
        z-index: 0;
        top: 6px;
        left: 7px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        content: "";
        filter: blur(4px);
      }

      .pack-regen-ticks {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 0 2px rgba(166, 255, 13, 0.25));
      }

      .pack-voltage-label,
      .pack-voltage-value,
      .regen-value {
        position: absolute;
        left: 0;
        width: 100%;
      }

      .pack-voltage-label {
        top: 56px;
        color: #697180;
        font-size: 15px;
        letter-spacing: 0.7px;
        text-transform: uppercase;
      }

      .pack-voltage-value {
        top: 83px;
        font-size: 38px;
        font-weight: 600;
        line-height: 1;
      }

      .pack-voltage-value .unit {
        font-size: 0.7em;
      }

      .regen-value {
        top: 126px;
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
      }

      .pack-voltage-label,
      .pack-voltage-value,
      .regen-value {
        z-index: 2;
      }

      @media (prefers-reduced-motion: reduce) {
        .metric-lap-time .lap-flash,
        .metric-temperature.is-over-limit .metric-label,
        .metric-temperature.is-over-limit .metric-value {
          animation: none;
          color: var(--alert-color);
        }
      }

      @media (max-width: 860px) {
        .dashboard-screen {
          width: min(90vw, 800px);
          height: min(60vw, 480px);
        }

        .dashboard-header {
          height: 9.17%;
        }

        .event-label,
        .driver-name {
          min-width: 14%;
          padding: 0 2%;
          font-size: clamp(6px, 1.25vw, 10px);
          letter-spacing: 0.6px;
        }

        .driver-name {
          min-width: 23%;
        }

        .fs-logo {
          width: 82.25%;
          height: 105%;
          background-position: -9% -62%;
          background-size: 115.052% 161.864%;
        }

        .metric-lap-time {
          top: 12.9%;
          left: 3.5%;
          width: 21.25%;
          height: auto;
          aspect-ratio: 1;
          gap: 1%;
        }

        .metric-lap-time .metric-label {
          font-size: clamp(10px, 2.625vw, 21px);
        }

        .metric-lap-time .metric-value {
          font-size: clamp(15px, 4vw, 32px);
        }

        .metric-lap-time .lap-delta {
          font-size: clamp(11px, 2.75vw, 22px);
        }

        .metric-speed {
          top: 19.17%;
          left: 31.25%;
          width: 37.5%;
          height: auto;
          aspect-ratio: 1;
        }

        .metric-speed .metric-label {
          font-size: clamp(14px, 3.75vw, 30px);
        }

        .metric-speed .metric-value {
          font-size: clamp(54px, 18.75vw, 150px);
        }

        .metric-speed .metric-unit {
          font-size: clamp(24px, 6vw, 48px);
        }

        .metric-power {
          top: 33.33%;
          right: 0.75%;
          width: 25%;
          height: auto;
          aspect-ratio: 1;
          gap: 1%;
        }

        .metric-power .metric-value {
          font-size: clamp(26px, 7.75vw, 62px);
        }

        .metric-power .metric-unit {
          font-size: clamp(16px, 4vw, 32px);
        }

        .metric-power .metric-label {
          font-size: clamp(11px, 2.75vw, 22px);
        }

        .metric-motor-temp {
          top: 1.67%;
          left: 65%;
          width: 17.5%;
          height: auto;
          aspect-ratio: 1;
        }

        .metric-cell-peak {
          bottom: 1.67%;
          left: 64.375%;
          width: 17.5%;
          height: auto;
          aspect-ratio: 1;
        }

        .metric-temperature .metric-label {
          font-size: clamp(8px, 1.875vw, 15px);
        }

        .metric-temperature .metric-value {
          margin-top: 2%;
          font-size: clamp(18px, 4.25vw, 34px);
        }

        .pack-regen {
          bottom: 2.5%;
          left: 5.5%;
          width: 26.875%;
          height: auto;
          aspect-ratio: 1;
        }

        .pack-regen::before {
          top: 2.8%;
          left: 3.25%;
          width: 93.02%;
          height: 93.02%;
        }

        .pack-voltage-label {
          top: 26%;
          font-size: clamp(8px, 1.875vw, 15px);
        }

        .pack-voltage-value {
          top: 39%;
          font-size: clamp(20px, 4.75vw, 38px);
        }

        .regen-value {
          top: 59%;
          font-size: clamp(16px, 3.5vw, 28px);
        }

        .dashboard-menu {
          top: 1.67%;
          right: 1.5%;
        }

        .menu-toggle {
          width: 88px;
          height: 32px;
        }
      }
    </style>
  </head>
  <body>
    <main class="dashboard-screen" aria-label="Endurance dashboard">
      <header class="dashboard-header">
        <div class="event-label">Endurance</div>
        <div class="driver-name" id="driver-name">Driver Name</div>
      </header>
      <div class="fs-logo" role="img" aria-label="Formula Student logo"></div>
      <section class="metric metric-lap-time" aria-label="Lap time and delta">
        <span class="metric-label">Lap Time</span>
        <span class="metric-value" id="lap-time-value">00:00.00</span>
        <span class="lap-delta" id="lap-delta-value">+/-.00</span>
      </section>
      <section class="metric metric-speed" aria-label="Vehicle speed">
        <span class="metric-label">Speed</span>
        <span class="metric-value" id="speed-value">000</span>
        <span class="metric-unit">kph</span>
      </section>
      <section class="metric metric-motor-temp metric-temperature" aria-label="Motor temperature">
        <span class="metric-label">Motor Temp</span>
        <span class="metric-value"><span id="motor-temp-value">00</span><span class="metric-unit"> °C</span></span>
      </section>
      <section class="metric metric-power" aria-label="Power output">
        <span class="metric-label">Power</span>
        <span class="metric-value"><span id="power-value">00</span><span class="metric-unit"> kW</span></span>
        <span class="metric-label">Output</span>
      </section>
      <section class="metric metric-cell-peak metric-temperature" aria-label="Cell peak temperature">
        <span class="metric-label">Cell Peak</span>
        <span class="metric-value"><span id="cell-peak-value">00</span><span class="metric-unit"> °C</span></span>
      </section>
      <section class="pack-regen" aria-label="Pack voltage and regenerative braking">
        <svg class="pack-regen-ticks" viewBox="0 0 218 219" aria-hidden="true"></svg>
        <span class="pack-voltage-label">Pack V</span>
        <span class="pack-voltage-value"><span id="pack-voltage-value">000</span><span class="unit">V</span></span>
        <span class="regen-value">reGen <span id="regen-value">%</span></span>
      </section>
      <div class="dashboard-menu">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel">
          <svg class="menu-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <span>Menu</span>
        </button>
        <nav class="menu-panel" id="menu-panel" aria-label="Dashboard menu" hidden>
          <a class="menu-item" href="dash.html">Driver selection</a>
          <a class="menu-item" href="default-driver.html">Driver dashboard</a>
          <a class="menu-item" href="mech-telemetry.html">Mechanical telemetry</a>
          <a class="menu-item" href="personal-bests.html" id="personal-bests-link" hidden>Personal bests</a>
          <a class="menu-item" href="event-dashboard.html?event=acceleration">Acceleration</a>
          <a class="menu-item" href="event-dashboard.html?event=skid-pad">Skid Pad</a>
          <a class="menu-item" href="sprint-dashboard.html">Sprint</a>
          <a class="menu-item" href="endurance-dashboard.html" aria-current="page">Endurance</a>
        </nav>
      </div>
    </main>
    <script src="dashboard-common.js"></script>
    <script>
      DashboardCommon.showSelectedDriver("#driver-name", "the Endurance dashboard");
      DashboardCommon.initPackRegenDial();
      DashboardCommon.initMenu();

      const telemetryFields = {
        speedKph: ["#speed-value", 0, 3, 0],
        powerKw: ["#power-value", 0, 2, 0],
        motorTempC: ["#motor-temp-value", 0, 2, 0],
        cellPeakTempC: ["#cell-peak-value", 0, 2, 0],
      };
      const temperatureMetrics = {
        motorTempC: ".metric-motor-temp",
        cellPeakTempC: ".metric-cell-peak",
      };
      const alertThresholds = { proposedLapTimeMs: null, motorTempC: null, cellPeakTempC: null };
      const latest = {};
      const lapTime = document.querySelector("#lap-time-value");
      const lapDelta = document.querySelector("#lap-delta-value");
      const dialFields = ["packVoltageV", "regenPercent"];

      function validateDialReadings(readings) {
        if (!readings || typeof readings !== "object" || Array.isArray(readings)) {
          throw new TypeError("Endurance dial readings must be an object.");
        }
        const updates = Object.entries(readings);
        if (!updates.length) throw new TypeError("At least one Endurance dial reading must be provided.");
        for (const [key, value] of updates) {
          if (!dialFields.includes(key)) throw new RangeError(`Unknown Endurance dial field: ${key}`);
          if (typeof value !== "number" || !Number.isFinite(value)) {
            throw new TypeError(`${key} must be a finite number.`);
          }
          if (value < 0 || (key === "regenPercent" && value > 100)) {
            throw new RangeError(`${key} must be a finite, non-negative ${key === "regenPercent" ? "percentage no greater than 100" : "voltage"}.`);
          }
        }
        return updates;
      }

      window.updateEnduranceDial = (readings) => {
        for (const [key, value] of validateDialReadings(readings)) {
          const element = document.querySelector(key === "packVoltageV" ? "#pack-voltage-value" : "#regen-value");
          element.textContent = key === "packVoltageV"
            ? String(Math.round(value)).padStart(3, "0")
            : `${Math.round(value)}%`;
        }
      };

      function formatLapTime(milliseconds) {
        const centiseconds = Math.floor(milliseconds / 10);
        return `${String(Math.floor(centiseconds / 6000)).padStart(2, "0")}:` +
          `${String(Math.floor(centiseconds / 100) % 60).padStart(2, "0")}.` +
          String(centiseconds % 100).padStart(2, "0");
      }

      function updateLapDelta() {
        const proposed = alertThresholds.proposedLapTimeMs;
        const states = ["delta-ahead", "delta-on-target", "delta-behind"];
        lapTime.classList.remove(...states);
        lapDelta.classList.remove(...states);
        if (proposed === null || latest.lapTimeMs === undefined) {
          lapDelta.textContent = "+/-.00";
          return;
        }
        const delta = latest.lapTimeMs - proposed;
        const state = delta < -200 ? "delta-ahead" : delta <= 200 ? "delta-on-target" : "delta-behind";
        lapDelta.textContent = `${delta < 0 ? "-" : "+"}${(Math.abs(delta) / 1000).toFixed(2)}`;
        lapTime.classList.add(state);
        lapDelta.classList.add(state);
      }

      function flashLapResult() {
        for (const element of [lapTime, lapDelta]) {
          element.classList.remove("lap-flash");
          void element.offsetWidth;
          element.classList.add("lap-flash");
        }
      }

      function updateTemperatureAlert(key) {
        document.querySelector(temperatureMetrics[key]).classList.toggle(
          "is-over-limit",
          latest[key] !== undefined && alertThresholds[key] !== null && latest[key] > alertThresholds[key],
        );
      }

      window.setEnduranceAlertThresholds = (updates) => {
        if (!updates || typeof updates !== "object" || Array.isArray(updates)) {
          throw new TypeError("Endurance alert thresholds must be an object.");
        }
        const entries = Object.entries(updates);
        if (!entries.length) throw new TypeError("At least one Endurance alert threshold must be provided.");
        for (const [key, value] of entries) {
          if (!Object.hasOwn(alertThresholds, key)) throw new RangeError(`Unknown Endurance alert threshold: ${key}`);
          if (value !== null && (typeof value !== "number" || !Number.isFinite(value) || value < 0)) {
            throw new RangeError(`Endurance alert threshold "${key}" must be null or a finite, non-negative number.`);
          }
        }
        for (const [key, value] of entries) {
          alertThresholds[key] = value;
          if (key === "proposedLapTimeMs") updateLapDelta();
          else updateTemperatureAlert(key);
        }
      };

      window.updateEnduranceTelemetry = (readings) => {
        if (!readings || typeof readings !== "object" || Array.isArray(readings)) {
          throw new TypeError("Endurance telemetry readings must be an object.");
        }
        const entries = Object.entries(readings);
        if (!entries.length) throw new TypeError("At least one Endurance telemetry reading must be provided.");
        const ordinary = {};
        const dial = {};
        for (const [key, value] of entries) {
          if (Object.hasOwn(telemetryFields, key)) ordinary[key] = value;
          else if (dialFields.includes(key)) dial[key] = value;
          else if (key === "lapTimeMs" || key === "proposedLapTimeMs") {
            if (typeof value !== "number" || !Number.isFinite(value) || value < 0) {
              throw new RangeError(`${key} must be a finite, non-negative number of milliseconds.`);
            }
          } else throw new RangeError(`Unknown Endurance telemetry field: ${key}`);
        }
        const prepared = DashboardCommon.prepareTelemetry(ordinary, telemetryFields, "Endurance");
        if (Object.keys(dial).length) validateDialReadings(dial);
        for (const [key, value] of entries) {
          if (key === "lapTimeMs" || key === "proposedLapTimeMs") {
            if (key === "lapTimeMs") latest[key] = value;
            else alertThresholds[key] = value;
          } else if (Object.hasOwn(temperatureMetrics, key)) latest[key] = value;
        }
        DashboardCommon.applyTelemetry(prepared);
        if (Object.keys(dial).length) window.updateEnduranceDial(dial);
        if (latest.lapTimeMs !== undefined) lapTime.textContent = formatLapTime(latest.lapTimeMs);
        if (entries.some(([key]) => key === "lapTimeMs" || key === "proposedLapTimeMs")) updateLapDelta();
        if (entries.some(([key]) => key === "lapTimeMs")) flashLapResult();
        for (const [key] of entries) {
          if (Object.hasOwn(temperatureMetrics, key)) updateTemperatureAlert(key);
        }
      };

      window.addEventListener("can-telemetry", (event) => {
        window.updateEnduranceTelemetry(event.detail);
      });
    </script>
  </body>
</html>
