<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Document metadata and the display font used by the welcome heading. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard-common.css" />
    <style>
      html,
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      /*
       * Welcome-screen canvas. The first background layer is the requested
       * #0B1220CC (80%) scrim; the second layer is the shared dashboard image.
       */
      .welcome-screen {
        position: relative; width: 800px; height: 480px; overflow: hidden;
        background: linear-gradient(rgba(11, 18, 32, 0.80), rgba(11, 18, 32, 0.80)),
          url("dashBg.jpg") lightgray 50% / cover no-repeat;
        border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: inset 0 0 0 1px rgba(11, 18, 32, 0.30);
      }

      /* Center the transparent FS logo, preserving its crop and blend treatment. */
      .fs-logo {
        position: absolute; top: 50%; left: 50%; width: 554px; height: 464px; transform: translate(-50%, -50%);
        background: url("fslogo-transparent.png") transparent -49.782px -287.051px / 115.052% 161.864% no-repeat;
        opacity: 0.45; mix-blend-mode: screen; filter: blur(1px);
      }

      /* Main welcome title, centered independently from the logo artwork. */
      .welcome {
        position: absolute; top: 50%; left: 50%; display: flex; width: 781px; height: 171px;
        flex-direction: column; justify-content: center; margin: 0; transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.55); text-align: center; font-family: "Allerta Stencil", sans-serif;
        font-size: 128px; font-style: normal; font-weight: 400; line-height: normal; letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      /* Scale the canvas and title down on smaller browser windows. */
      @media (max-width: 860px) {
        .welcome-screen {
          width: min(90vw, 800px); height: min(60vw, 480px);
        }

        .welcome {
          width: 98%; font-size: clamp(48px, 16vw, 128px);
        }
      }
    </style>
  </head>
  <body>
    <!-- Static opening screen only; CAN readings are not consumed on this page. -->
    <main class="welcome-screen" aria-label="Welcome screen">
      <!-- Decorative logo artwork is kept separate from the accessible heading. -->
      <div class="fs-logo" role="img" aria-label="Formula Student logo"></div>
      <h1 class="welcome">WELCOME</h1>
    </main>
    <script src="dashboard-common.js"></script>
  </body>
</html>
