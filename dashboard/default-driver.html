    <style>
      /* Main driver display; the dark overlay matches the other dashboard pages. */
      .dashboard-screen {
        position: relative; width: 800px; height: 480px;
        background: linear-gradient(rgba(11, 18, 32, 0.80), rgba(11, 18, 32, 0.80)),
          url("dashBg.jpg") lightgray 50% / cover no-repeat;
        border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: inset 0 0 0 1px rgba(11, 18, 32, 0.30);
      }

      /* Navigation dropdown shared by the dashboard pages. */
      .dashboard-menu {
        position: absolute; top: 10px; right: 16px; z-index: 3; font-family: Arial, Helvetica, sans-serif;
      }

      .menu-toggle {
        display: flex; width: 124px; height: 36px; padding: 8px 12px; align-items: center;
        justify-content: center; gap: 10px; border: 0; border-radius: 10px;
        background: rgba(255, 255, 255, 0.902); color: #0b1220; font: 600 13px/1 "Josefin Slab", Georgia, serif;
        cursor: pointer;
      }

      .menu-toggle:hover {
        background: #fff;
      }

      .menu-toggle:focus-visible,
      .menu-item:focus-visible {
        outline: 2px solid #fff; outline-offset: 3px;
      }

      .menu-icon {
        width: 16px; height: 16px; flex: 0 0 16px;
      }

      .menu-panel {
        position: absolute; top: 44px; right: 0; width: 224px; padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; background: rgba(11, 18, 32, 0.96);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }

      .menu-panel[hidden] {
        display: none;
      }

      .menu-item {
        display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 6px; background: transparent;
        color: rgba(255, 255, 255, 0.9); text-align: left; text-decoration: none;
        font: 14px/1.3 Arial, Helvetica, sans-serif; cursor: pointer;
      }

      .menu-item:hover,
      .menu-item[aria-current="page"] {
        background: rgba(255, 255, 255, 0.12);
      }

      /* Driver identity label and name in the upper-left corner. */
      .driver-identity {
        position: absolute; top: 24px; left: 48px; display: flex; width: 220px; flex-direction: column;
        align-items: stretch; gap: 12px; font-family: "Rajdhani", sans-serif; text-align: center;
        text-transform: uppercase;
      }

      .driver-label {
        align-self: stretch; color: #6b7280; font-size: 13px; font-style: normal; font-weight: 600;
        line-height: normal; letter-spacing: 1.2px;
      }

      .driver-name {
        align-self: stretch; color: #fff; font-size: 40px; font-style: normal; font-weight: 700;
        line-height: normal;
      }

      /* Shared circle layout and soft white backing for the metric gauges. */
      .metric {
        position: absolute; z-index: 1; display: flex; flex-direction: column; align-items: center;
        justify-content: center; border-radius: 50%; color: #141925;
        font-family: "Josefin Slab", Georgia, serif; text-align: center;
      }

      .metric::before {
        position: absolute; z-index: -1; border-radius: 50%; background: rgba(255, 255, 255, 0.90); content: "";
        filter: blur(4px); inset: 4px;
      }

      .rpm-segments {
        position: absolute; z-index: 0; top: -22px; left: -22px; width: 184px; height: 184px; overflow: visible;
      }

      .metric-label {
        position: relative; z-index: 1; color: #697180; font-size: 15px; font-weight: 400;
        letter-spacing: 0.7px; text-transform: uppercase;
      }

      .metric-value {
        position: relative; z-index: 1; margin-top: 6px; font-size: 28px; font-weight: 600; line-height: 1;
      }

      /* RPM gauge: 140px face with the 184px SVG segment ring. */
      .metric-rpm {
        top: 35.6%; left: 9.5%; width: 140px; height: 140px;
      }

      /* Large center speed readout and its unit. */
      .metric-speed {
        top: 24.6%; left: 33.25%; width: 240px; height: 240px;
      }

      .metric-speed .metric-label {
        font-size: 18px;
      }

      .metric-speed .metric-value {
        font-size: 72px; font-weight: 700;
      }

      .metric-speed .metric-unit {
        font-size: 54px; font-weight: 700;
      }

      /* Smaller torque gauge above the main speed display. */
      .metric-torque {
        top: 2.3%; left: 61.25%; width: 140px; height: 140px;
      }

      /* Battery gauge face and its independently positioned segment ring. */
      .metric-battery {
        top: 30%; left: 72.75%; width: 200px; height: 200px;
      }

      .metric-battery::before {
        inset: 34px;
      }

      .battery-segments {
        position: absolute; z-index: 0; top: 4px; left: 4px; width: 192px; height: 192px; overflow: visible;
      }

      /* Motor temperature gauge in the lower-right area. */
      .metric-motor-temp {
        top: 68.7%; left: 60.1%; width: 140px; height: 140px;
      }

      /* Decorative Formula Student logo in the lower-left of the canvas. */
      .fs-logo {
        position: absolute; bottom: 0; left: 0; width: 184px; height: 149px;
        background: url("fslogo-transparent.png") transparent -16.534px -92.178px / 115.052% 161.864% no-repeat;
        opacity: 0.45; mix-blend-mode: screen; filter: blur(1px);
      }

      /* Preserve relative gauge placement while scaling the dashboard responsively. */
      @media (max-width: 860px) {
        .dashboard-screen {
          width: min(90vw, 800px); height: min(60vw, 480px);
        }

        .dashboard-menu {
          top: 8px; right: 8px;
        }

        .driver-identity {
          top: 5%; left: 5%; width: 27.5%; gap: 2.5vw;
        }

        .driver-name {
          font-size: clamp(24px, 5vw, 40px);
        }

        .metric-rpm,
        .metric-torque,
        .metric-motor-temp {
          width: 17.5%; height: 29.17%;
        }

        .metric-battery {
          width: 25%; height: 41.67%;
        }

        .metric-battery::before {
          inset: 17%;
        }

        .battery-segments {
          top: 2%; left: 2%; width: 96%; height: 96%;
        }

        .metric-speed {
          width: 30%; height: 50%;
        }

        .metric-value {
          font-size: clamp(14px, 3.5vw, 28px);
        }

        .metric-speed .metric-value {
          font-size: clamp(30px, 9vw, 72px);
        }

        .metric-speed .metric-unit {
          font-size: clamp(24px, 6.75vw, 54px);
        }

        .metric-label {
          font-size: clamp(9px, 1.9vw, 15px);
        }

        .metric-speed .metric-label {
          font-size: clamp(11px, 2.25vw, 18px);
        }

        .fs-logo {
          width: 23%; height: 31%; background-position: -9% -62%; background-size: 115.052% 161.864%;
        }
      }
    </style>

    <script src="dashboard-common.js"></script>
    <script>
      // Resolve static gauge SVG artwork once; subsequent updates only change its fills.
      const rpmGauge = document.querySelector(".metric-rpm");
      const rpmReadout = document.querySelector("#rpm-value");
      const rpmSegments = Array.from(
        document.querySelectorAll(".rpm-segments rect")
      );
      const redlineRPM = Number(rpmGauge.dataset.redlineRpm);
      const activeColors = {
        "#576375": "#39c981",
        "#9E7D2E": "#ffd34e",
        "#9E403D": "#ff554f",
      };

      if (!Number.isFinite(redlineRPM) || redlineRPM <= 0) {
        throw new RangeError("The RPM gauge redline must be a positive number.");
      }

      if (rpmSegments.length === 0) {
        throw new Error("The RPM gauge has no SVG segments to update.");
      }

      const segmentBaseColors = rpmSegments.map((segment) => {
        const color = segment.getAttribute("fill");
        if (!color || !activeColors[color]) {
          throw new Error(`Unsupported base color on RPM segment: ${color}`);
        }
        return color;
      });

      /*
       * Single-value RPM API. The gauge uses a 12,000 RPM redline from the
       * data-redline-rpm attribute; change that HTML value to match the car.
       * The number passed here must already be decoded and scaled to RPM.
       */
      window.setDashboardRPM = (rpm) => {
        if (typeof rpm !== "number" || !Number.isFinite(rpm) || rpm < 0) {
          throw new RangeError("RPM must be a finite, non-negative number.");
        }

        const gaugeProgress = Math.min(rpm / redlineRPM, 1);
        const activeSegmentCount = Math.floor(gaugeProgress * rpmSegments.length);

        rpmSegments.forEach((segment, index) => {
          const baseColor = segmentBaseColors[index];
          segment.setAttribute(
            "fill",
            index < activeSegmentCount ? activeColors[baseColor] : baseColor
          );
        });

        rpmReadout.textContent = `${rpm.toFixed(1)} rpm`;
        rpmGauge.setAttribute(
          "aria-label",
          `Engine speed: ${Math.round(rpm)} RPM`
        );
      };

      // Optional legacy/single-signal bridge; prefer the combined telemetry event below.
      window.addEventListener("can-rpm", (event) => {
        if (typeof event.detail?.rpm !== "number") {
          throw new TypeError('The "can-rpm" event must contain a numeric detail.rpm.');
        }
        window.setDashboardRPM(event.detail.rpm);
      });

      const batteryGauge = document.querySelector(".metric-battery");
      const batteryReadout = document.querySelector("#battery-value");
      const batterySegments = Array.from(
        document.querySelectorAll(".battery-segments rect")
      );
      // Thresholds are HTML data attributes so warning behavior can be tuned per vehicle.
      const lowBatteryThreshold = Number(batteryGauge.dataset.lowThreshold);
      const mediumBatteryThreshold = Number(batteryGauge.dataset.mediumThreshold);
      const batteryColors = {
        low: "#FF401A",
        medium: "#FFCC0D",
        high: "#26FF33",
        inactive: "#576375",
      };

      if (batterySegments.length === 0) {
        throw new Error("The battery gauge has no SVG segments to update.");
      }

      if (
        !Number.isFinite(lowBatteryThreshold) ||
        !Number.isFinite(mediumBatteryThreshold) ||
        lowBatteryThreshold < 0 ||
        mediumBatteryThreshold <= lowBatteryThreshold ||
        mediumBatteryThreshold > 100
      ) {
        throw new RangeError("Battery warning thresholds must be ordered values from 0 to 100.");
      }

      window.setDashboardBattery = (percentage) => {
        if (
          typeof percentage !== "number" ||
          !Number.isFinite(percentage) ||
          percentage < 0 ||
          percentage > 100
        ) {
          throw new RangeError("Battery charge must be a number from 0 to 100.");
        }

        const activeSegmentCount = Math.round(
          (percentage / 100) * batterySegments.length
        );
        const activeColor =
          percentage <= lowBatteryThreshold
            ? batteryColors.low
            : percentage <= mediumBatteryThreshold
              ? batteryColors.medium
              : batteryColors.high;

        batterySegments.forEach((segment, index) => {
          segment.setAttribute(
            "fill",
            index < activeSegmentCount ? activeColor : batteryColors.inactive
          );
        });

        batteryReadout.textContent = `${Math.round(percentage)}%`;
        batteryGauge.setAttribute(
          "aria-label",
          `Battery charge: ${Math.round(percentage)} percent`
        );
      };

      // Optional legacy/single-signal bridge; charge must be a percentage from 0 to 100.
      window.addEventListener("can-battery", (event) => {
        if (typeof event.detail?.percentage !== "number") {
          throw new TypeError('The "can-battery" event must contain a numeric detail.percentage.');
        }
        window.setDashboardBattery(event.detail.percentage);
      });

      // Color the initial 75% placeholder using the same logic as incoming readings.
      window.setDashboardBattery(Number(batteryReadout.textContent.replace("%", "")));

      // Text-only metric mappings for readings that do not use segmented SVG gauges.
      const defaultTelemetryFields = {
        speedKph: {
          element: document.querySelector("#speed-value"),
          digits: 1,
          minimum: 0,
        },
        torquePercent: {
          element: document.querySelector("#torque-value"),
          digits: 0,
          minimum: 0,
          maximum: 100,
        },
        motorTempC: {
          element: document.querySelector("#motor-temp-value"),
          digits: 1,
        },
      };

      /*
       * Raspberry Pi / CAN handoff for this screen:
       * The Pi backend must decode CAN frames, then pass decoded values to this page.
       * Call updateDefaultTelemetry({ rpm, batteryPercent, speedKph,
       * torquePercent, motorTempC }); keys are optional so partial CAN packets work.
       * This HTML does not open a CAN interface or connect to a Pi service by itself.
       */
      window.updateDefaultTelemetry = (readings) => {
        if (!readings || typeof readings !== "object" || Array.isArray(readings)) {
          throw new TypeError("Default dashboard telemetry must be an object.");
        }

        const updates = Object.entries(readings);
        const supportedFields = new Set([
          "rpm",
          "batteryPercent",
          ...Object.keys(defaultTelemetryFields),
        ]);

        for (const [key, value] of updates) {
          if (!supportedFields.has(key)) {
            throw new RangeError(`Unknown default dashboard telemetry field: ${key}`);
          }
          if (typeof value !== "number" || !Number.isFinite(value)) {
            throw new TypeError(`Telemetry value "${key}" must be a finite number.`);
          }
          if (key === "rpm" && value < 0) {
            throw new RangeError("RPM must be a non-negative number.");
          }
          if (key === "batteryPercent" && (value < 0 || value > 100)) {
            throw new RangeError("Battery charge must be a number from 0 to 100.");
          }

          const field = defaultTelemetryFields[key];
          if (
            field &&
            (value < (field.minimum ?? Number.NEGATIVE_INFINITY) ||
              value > (field.maximum ?? Number.POSITIVE_INFINITY))
          ) {
            throw new RangeError(`Telemetry value "${key}" is outside its supported range.`);
          }
        }

        for (const [key, value] of updates) {
          if (key === "rpm") {
            window.setDashboardRPM(value);
          } else if (key === "batteryPercent") {
            window.setDashboardBattery(value);
          } else {
            const field = defaultTelemetryFields[key];
            field.element.textContent = value.toFixed(field.digits);
          }
        }
      };

      /*
       * CAN bridge entry point:
       * A Pi-backed WebSocket or local service can dispatch
       * new CustomEvent("can-telemetry", { detail: decodedReadings }) on this window.
       * decodedReadings should use the keys documented above and numeric engineering
       * values (for example speedKph in km/h and motorTempC in degrees Celsius).
       */
      window.addEventListener("can-telemetry", (event) => {
        window.updateDefaultTelemetry(event.detail);
      });

      DashboardCommon.showSelectedDriver(
        "#current-driver",
        "this session",
        "Default",
        new URLSearchParams(window.location.search).get("driver") === "default",
        "Default",
      );
      DashboardCommon.initMenu();
    </script>
  </body>
</html>
